<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeraOffice - login</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Global Styles & Variables */
      :root {
        --primary-color: #2563eb; /* Modern Tech Blue */
        --primary-hover: #1d4ed8; /* Darker blue for hover states */
        --text-main: #1f2937; /* Off-black for premium readability */
        --text-muted: #4b5563; /* Dark gray for subtitles/secondary text */
        --bg-navbar: rgba(
          255,
          255,
          255,
          0.85
        ); /* Semi-transparent background */
        --border-color: rgba(0, 0, 0, 0.06);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      .home-body {
        background-color: #91c6fc; /* Minimalist clean bright background */
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .text-card {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 360px;
        max-width: 100%;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .card-title {
        color: var(--text-main);
        font-size: 1.5rem;
        margin: 0 0 8px 0;
        font-weight: 600;
        text-align: center;
      }

      .card-text {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.5;
        margin-bottom: 24px;
        text-align: center;
      }

      .auth-input {
        width: 100%;
        padding: 12px 14px;
        margin-bottom: 14px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 0.95rem;
        color: var(--text-main);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .auth-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .card-button {
        display: inline-block;
        width: 100%;
        color: #ffffff;
        background-color: var(--primary-color);
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
        text-align: center;
        margin-bottom: 8px;
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
      }

      .card-button:hover {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
      }

      .btn-danger {
        background-color: #dc3545;
        box-shadow: 0 4px 6px -1px rgba(220, 53, 69, 0.2);
      }

      .btn-danger:hover {
        background-color: #b02a37;
      }

      .hidden {
        display: none;
      }

      .user-info {
        font-size: 0.95rem;
        color: var(--text-muted);
        margin-bottom: 20px;
        text-align: center;
        word-break: break-all;
      }

      .user-info strong {
        color: var(--text-main);
      }
    </style>
  </head>
  <body class="home-body">
    <div class="text-card">
      <h2 class="card-title">VeraOffice</h2>
      <p class="card-text">logi in, create an account or sign out</p>

      <div id="auth-container">
        <input
          type="email"
          id="email"
          class="auth-input"
          placeholder="E-Mail-address"
        />
        <input
          type="password"
          id="password"
          class="auth-input"
          placeholder="Passwort"
        />
        <button class="card-button" onclick="signin()">sign in</button>
        <button
          class="card-button"
          onclick="register()"
          style="background-color: #4b5563"
        >
          register
        </button>
      </div>

      <div id="dashboard-container" class="hidden">
        <div class="user-info">
          logged in as:<br /><strong id="user-email"></strong>
        </div>
        <button class="card-button btn-danger" onclick="signout()">
          sign out
        </button>
      </div>
    </div>

    <script>
      const supabaseUrl = "https://mmtlwtyyggwrqkylpqxv.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tdGx3dHl5Z2d3cnFreWxwcXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MjYxNjAsImV4cCI6MjEwODQwMjE2MH0.HZKSAimGH8U87QW0KJmDXAaSUzf_0baYkDQ-5uUdPgM";

      const supabaseClient = supabase.createClient(
        supabaseUrl,
        supabaseAnonKey,
      );

      async function checkSession() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (session) {
          document.getElementById("auth-container").classList.add("hidden");
          document
            .getElementById("dashboard-container")
            .classList.remove("hidden");
          document.getElementById("user-email").innerText = session.user.email;
        }
      }
      checkSession();

      async function register() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
        });
        if (error) {
          alert("Registrierung fehlgeschlagen, Sir: " + error.message);
        } else {
          alert(
            "Registrierung erfolgreich, Leutnant! Falls aktiv, prüfen Er Seinen Posteingang.",
          );
        }
      }

      async function signin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });
        if (error) {
          alert(
            "Zugriff verweigert, Leutnant! Falsche Papiere?: " + error.message,
          );
        } else {
          alert("Willkommen zurück im Stützpunkt, Sir!");
          location.reload();
        }
      }

      async function signout() {
        await supabaseClient.auth.signOut();
        alert("Abgemeldet, Leutnant!");
        location.reload();
      }
    </script>
  </body>
</html>
