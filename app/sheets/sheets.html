<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeraOffice - Sheets</title>
    <link rel="stylesheet" href="../../style-editor.css" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <script src="sheets.js" defer></script>
</head>
<body>
    <header class="header-container">
      <nav class="navbar">
        <ul class="nav-links">
          <li><a id="home-btn-text" href="../app.html">Home</a></li>
          <li><a id="file-btn-text">File</a></li>
          <li><a id="start-btn-text">Start</a></li>
          <li><a href="../../login.html" data-auth-link>Sign in (optional)</a></li>
        </ul>
      </nav>

      <div id="file-text-toolbar" class="hidden toolbar">
        <button id="save-local-btn-file">Save locally</button>
        <button id="save-cloud-btn-file">Save in Cloud</button>
      </div>
      
      <div id="start-text-toolbar" class="hidden toolbar">
        <button id="undo-btn">undo</button>
        <button id="redo-btn">redo</button>
        <button id="insert-btn-sheets">insert</button>
        <button id="copy-btn-sheets">copy</button>
        <button id="bold-btn">bold</button>
        <button id="italic-btn">italic</button>
        <span id="clipboard-status" role="status" aria-live="polite"></span>

        <div class="toolbar-separator"></div>

        <div class="size-combobox">
          <input
            type="text"
            id="font-size-input"
            list="size-options"
            value="16px"
            placeholder="16px"
          />
          <datalist id="size-options">
            <option value="12px"></option>
            <option value="14px"></option>
            <option value="16px"></option>
            <option value="18px"></option>
            <option value="24px"></option>
            <option value="32px"></option>
          </datalist>
        </div>
      </div>
    </header>

    <div id="spreadsheet" class="spreadsheet-container"></div>    
</body>
</html>
